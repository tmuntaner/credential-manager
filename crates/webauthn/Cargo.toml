[package]
name = "webauthn"
authors = ["Thomas Muntaner <thomas.muntaner@gmail.com>"]
version = "0.1.0"
edition = "2018"
license = "MPL-2.0"
description = "A webauthn client"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
notifications = ["notify-rust"]
progress_bar = ["indicatif"]
full = ["progress_bar", "notifications"]

[dependencies]
thiserror = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify-rust = { version ="4", optional = true }
indicatif = { version = "0.18", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
authenticator = { version = "0.5", default-features = false, features = ["crypto_rust"] }
rpassword = "7.3"
sha2 = "0.11"
