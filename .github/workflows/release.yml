name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Release for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Generate licenses
        run: cargo about generate about.txt.hbs -o license.txt

      - name: Build
        run: |
          cargo build --all --exclude c9s-egui --release
          strip target/release/c9s-cli
          mv target/release/c9s-cli target/release/c9s_amd64
          cd target/release && sha256sum c9s_amd64 > c9s_amd64.SHA256SUM

      - name: Build GUI
        run: |
          cargo build -p c9s-egui --release
          strip target/release/c9s-egui
          mv target/release/c9s-egui target/release/c9s-egui_amd64
          cd target/release && sha256sum c9s-egui_amd64 > c9s-egui_amd64.SHA256SUM

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            target/release/c9s_amd64
            target/release/c9s_amd64.SHA256SUM
            target/release/c9s-egui_amd64
            target/release/c9s-egui_amd64.SHA256SUM

  release-mac:
    name: Release for Mac
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Generate licenses
        run: cargo about generate about.txt.hbs -o license.txt

      - name: Build
        run: |
          cargo build --all --exclude c9s-egui --release
          strip target/release/c9s-cli
          mv target/release/c9s-cli target/release/c9s_darwin
          cd target/release && shasum -a 256 c9s_darwin > c9s_darwin.SHA256SUM

      - name: Build GUI
        run: |
          cargo build -p c9s-egui --release
          strip target/release/c9s-egui
          mv target/release/c9s-egui target/release/c9s-egui_darwin
          cd target/release && shasum -a 256 c9s-egui_darwin > c9s-egui_darwin.SHA256SUM

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            target/release/c9s_darwin
            target/release/c9s_darwin.SHA256SUM
            target/release/c9s-egui_darwin
            target/release/c9s-egui_darwin.SHA256SUM

  release-windows:
    name: Release for Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Generate licenses
        run: cargo about generate about.txt.hbs -o license.txt

      - name: Build
        shell: pwsh
        run: |
          cargo build --all --exclude c9s-egui --release
          cd target\release
          mv c9s-cli.exe c9s.exe
          $sum = (CertUtil -hashFile .\c9s.exe SHA256)[1] -replace " ",""
          "$sum c9s.exe" | Out-File .\c9s.exe.SHA256SUM

      - name: Build GUI
        shell: pwsh
        run: |
          cargo build -p c9s-egui --release
          cd target\release
          $sum = (CertUtil -hashFile .\c9s-egui.exe SHA256)[1] -replace " ",""
          "$sum c9s-egui.exe" | Out-File .\c9s-egui.exe.SHA256SUM

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            target/release/c9s.exe
            target/release/c9s.exe.SHA256SUM
            target/release/c9s-egui.exe
            target/release/c9s-egui.exe.SHA256SUM
