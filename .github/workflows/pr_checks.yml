name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Mac
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # A session bus and an unlocked keyring for the keyring example.
      - name: Set up keyring
        if: runner.os == 'Linux'
        run: |
          mkdir -p /home/runner/.cache/
          mkdir -p /home/runner/.local/share/keyrings/
          chmod 700 -R /home/runner/.local/
          export DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --print-address --fork)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo 'the-super-secret' | gnome-keyring-daemon --unlock
          eval "$(echo 'the-super-secret' | gnome-keyring-daemon --start -d --components secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"

      - name: Generate licenses
        run: cargo about generate about.txt.hbs -o license.txt

      - name: Run build
        run: cargo build --workspace --all-features

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run keyring example
        run: cargo run -p keyring --example example

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo deny
        run: cargo deny check licenses

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
