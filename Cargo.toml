[package]
name = "c9s"
version = "0.1.0-alpha18"
edition = "2021"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = ["crates/webauthn", "crates/keyring"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
base64 = "0.23.1"
url = "2.5.0"
sha2 = "0.11"

[dev-dependencies]
httpmock = "0.8"

[dependencies]
reqwest = { version = "0.13", features = ["json", "cookies", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
url = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
aws-sdk-sts = { version = "1.17.0", features = ["behavior-version-latest"] }
aws-smithy-types-convert = { version = "0.61", features = ["convert-time"] }
time = { version = "0.3.34", features = ["formatting", "parsing"] }
clap = { version = "4.5.3", features = ["derive"] }
async-trait = "0.1.78"
toml = "1"
dirs = "7"
rpassword = "7.3"
log = "0.4.21"
regex = "1.10"
futures = "0.3"
webauthn = { path = "./crates/webauthn", features = ["full"] }
keyring = { path = "./crates/keyring"}
quick-xml = "0.42"
